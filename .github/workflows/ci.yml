name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    # Linux, not Windows: the checkout is LF here, and ruff-format is configured for LF endings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      # pyright needs NVDA's own source tree, which is not checked out here, and no-commit-to-branch
      # has nothing to say about a CI checkout.
      - run: uv run pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch,pyright

  test:
    name: test
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      # The tests stub out NVDA and put their own directory on sys.path, so they run from tests/.
      - run: uv run python -m unittest discover -s . -p "test_*.py" -v
        working-directory: tests

  package:
    name: package
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # websocket-client is a submodule, and the plugin imports it at NVDA start.
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      # gettext supplies msgfmt (compiles the addon/locale po files into the bundle) and xgettext
      # (generates the translators' pot catalog).
      - uses: msys2/setup-msys2@v2
        with:
          install: gettext
          update: true
      - run: echo "C:\msys64\usr\bin" >> $env:GITHUB_PATH
      # A published release stamps the add-on with its own tag, so the packaged version cannot drift
      # from the release it is attached to. Every other build uses addon_version from buildVars.py.
      - name: Resolve add-on version
        if: github.event_name == 'release'
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          "ADDON_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build add-on
        run: |
          if ($env:ADDON_VERSION) { uv run scons version=$env:ADDON_VERSION } else { uv run scons }
      - run: uv run scons pot
      - run: uv run python .github/scripts/verify_artifact.py
      - uses: actions/upload-artifact@v7
        with:
          name: nvda-addon
          path: "*.nvda-addon"
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: pot-file
          path: "*.pot"
          if-no-files-found: error

  release:
    name: release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nvda-addon
      # The pot rides along on releases so translators can work from a stable catalog without a build
      # environment.
      - uses: actions/download-artifact@v7
        with:
          name: pot-file
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.nvda-addon
            *.pot
